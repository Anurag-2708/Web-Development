<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="main">
        <div class="left">
            <div class="calc-container">
                <div class="calc-box">
                    <div class="calc-display">
                        <div class="input">
                        </div>
                        <div class="output"></div>
                    </div>
                    <div class="calc-buttons">
                        <button class="number" data-value="7">7</button>
                        <button class="number" data-value="8">8</button>
                        <button class="number" data-value="9">9</button>
                        <button class="action" data-value="DEL">DEL</button>
                        <button class="action" data-value="AC">AC</button>
                        <button class="number" data-value="4">4</button>
                        <button class="number" data-value="5">5</button>
                        <button class="number" data-value="6">6</button>
                        <button class="operator" data-value="×">×</button>
                        <button class="operator" data-value="÷">÷</button>
                        <button class="number" data-value="1">1</button>
                        <button class="number" data-value="2">2</button>
                        <button class="number" data-value="3">3</button>
                        <button class="operator" data-value="+">+</button>
                        <button class="operator" data-value="-">-</button>
                        <button class="number" data-value="0">0</button>
                        <button class="decimal" data-value=".">.</button>
                        <button class="bracket" data-value="(">(</button>
                        <button class="bracket" data-value=")">)</button>
                        <button class="action" data-value="=">=</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="right"></div>
    </div>
    <div class="footer"></div>
</body>

</html>
